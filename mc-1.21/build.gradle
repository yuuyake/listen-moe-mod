plugins { id 'fabric-loom' version '1.16-SNAPSHOT' }
version = '1.0.0'
repositories { mavenCentral() }
sourceSets { main { java { srcDirs '../core/src/main/java', '../shared/src/main/java' } } }
dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    
    implementation "net.fabricmc:fabric-loader:0.19.2"
    implementation "net.fabricmc.fabric-api:fabric-api:0.141.0+1.21.11"
    implementation 'javazoom:jlayer:1.0.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    include 'javazoom:jlayer:1.0.1'
    include 'org.java-websocket:Java-WebSocket:1.5.7'
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.toVersion(21); targetCompatibility = JavaVersion.toVersion(21) }
